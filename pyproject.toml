[project]
name = "nephesh"
version = "4.3.0"
description = "MCP server for instantiating living AI entities — persistent memory and continuity of self"
requires-python = ">=3.12"
license = "GPL-2.0-only"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "lancedb>=0.12.0",
    "pyarrow>=15.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "slixmpp>=1.17.0",
]

[project.scripts]
nephesh = "mcp_experiments.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Core tests are deliberately confined to the repository's hermetic suite.
# Optional integration probes and local experiments must be invoked explicitly.
testpaths = ["tests"]
python_files = ["test_*.py"]
